# AdaptiveISP V1 config — sole source of truth for experiment-defining
# parameters. `engine/trainer._load_config` reads this file into a Dict
# and derives `num_state_dim` / `z_dim` / `max_iter_step` from the values
# below.
#
# Split:
#   - Fields under the top-level dict (backward-compat with the original
#     paper config) are consumed directly by Trainer / Controller / Reward.
#   - `train:` and `val:` name the CLI defaults so the experiment definition
#     is one file; `tools/train.py` and `tools/val.py` treat these as
#     defaults that CLI args (e.g. `--lr`, `--batch_size`) can override.
#   - Environment / hardware knobs (`--workers`, `--seed`, `--weights` path,
#     `--data_cfg` path) stay CLI-only; they do not define the experiment.

# ---------- Operators ----------
# Canonical order — matches isp.registry.CANONICAL_ORDER. Observation
# channel layout, PipelineState op_usage columns, and PipelineExecutor
# dispatch all key off this list. Classical ops come first so their
# integer indices stay stable across V1 checkpoints; the 7 neural
# operators are appended for V2-AI; 9 Infinite-ISP-derived ops append after.
operators:
  - exposure
  - gamma
  - ccm
  - sharpen
  - denoise
  - tone
  - contrast
  - saturation
  - wnb
  - whitebalance
  - n_awb
  - n_gain
  - n_gtm
  - n_chroma
  - n_gamma
  # - n_denoise
  # - n_detail
  # ----- Infinite-ISP-derived (Torch-native) -----
  - inf_awb_grayworld
  - inf_awb_norm2
  - inf_awb_pca
  - inf_digital_gain
  - inf_ldci
  - inf_unsharp
  - inf_nlm
  - inf_ebf
  - inf_saturation

# Runtime cost per op (aligned with `operators` above). Consumed by
# AdaptiveISPReward when runtime_penalty_enabled=true.
filters_runtime: [1.7, 2.0, 1.9, 6.3, 10.0, 2.7, 2.1, 2.0, 1.9, 1.7,
                  8.0, 3.0, 4.0, 0.4, 0.3,
                  1.5, 1.5, 3.0, 1.0, 3.5, 5.0, 12.0, 8.0, 1.7]
filter_runtime_penalty: false            # overridden by --runtime_penalty
filter_runtime_penalty_lambda: 0.01

# ---------- Front ISP (可插拔前置 ISP, V3.1 四种统一模式) ----------
# RAW → Front ISP → Baseline RGB → AdaptiveISP(Adaptive Tail) → Task。
# Front ISP 负责产生稳定的基础成像结果；Adaptive Tail 只做增量式优化。
#
# type（V3.1 统一）:
#   identity  — 不做前置处理（V2 / E0 parity，对照组；旧名 none）
#   fixed     — 人工配置 ISP：WB/CCM/Bias/Gamma 等简单模块，顺序与参数
#               全部由 fixed.modules 配置指定，训练不更新；模块注册表
#               开放扩展（denoise/sharpen/contrast = 注册一个函数即可，
#               见 front_isp/fixed.py）
#   learnable — 固定结构 + 可训练参数（WB gain / CCM / Bias / Gamma，
#               camera-specific 参数表）。两阶段训练：Stage 1 只训
#               Front ISP（--task learnable，见
#               configs/adaptiveisp_human_v31_pretrain.yaml），冻结后
#               Stage 2 跑 AdaptiveISP（v31_stage2.yaml）。
#               旧名 calibrated。
#   external  — 接入现有开源 ISP，backend: infinite_isp | samsung_isp，
#               wrapper 统一输入输出（见 front_isp/external.py）
#
# legacy 别名继续可用：none / calibrated / canonical（V3-A1 固定链）/
# infinite_isp / modular_neural_isp（直连 wrapper）。
#
# 每套 Front ISP 保留自己的内部配置（不抹平其可配置能力）：
#   front_isp:
#     enabled: true
#     type: external
#     external:
#       backend: infinite_isp
#       repo_path: third_party/Infinite-ISP
#       config_path: configs/front_isp/infinite.yaml
front_isp:
  enabled: false
  type: identity

# Legacy V3-A1 key（向后兼容）：`front_isp:` 段缺席时回落到这里。
# enabled: true 等价于 front_isp.type = canonical。
canonical_backbone:
  enabled: false

# ---------- Action Mask (V3-A2 阶段 1) ----------
# Dynamic op-mask priors composed by search.priors.action_mask. Each block
# is opt-in; leaving all `enabled: false` restores identity behavior (V2).
# See `search/priors/action_mask.py` for semantics.
action_mask:
  # 1. No repeat — every op is single-use per rollout unless whitelisted.
  no_repeat:
    enabled: false
    exempt: []       # op names that MAY be applied more than once
  # 2. Order — once any op in `after` has been used, every op in `before`
  #    is forbidden. Rules with unknown op names are silently dropped so
  #    the block is portable across op subsets.
  order:
    enabled: false
    rules: []
  # 3. Group budget — total picks per group ≤ max_select. Same-class
  #    mutex is just max_select=1.
  group_budget:
    enabled: false
    groups: []

# ---------- RL Algorithm (V3-A3 阶段 1) ----------
# `name: actor_critic` (default) keeps the 1-step TD + ReplayMemory recipe
# used since V1. `name: ppo` switches to T-step rollout → GAE → K-epoch
# clipped PPO. See controller/adaptiveisp/ppo.py for hyperparam semantics.
rl_algo:
  name: actor_critic
  ppo:
    epochs: 4              # K, PPO passes over the rollout
    clip_range: 0.2        # ε in the clipped surrogate
    value_coef: 0.5        # weight on the value MSE
    entropy_coef: 0.01     # weight on the entropy bonus
    advantage_norm: true   # normalize advantages per minibatch
    minibatch_size: 64
    grad_clip_norm: 0.5
    gae_lambda: 0.95
    # gamma: <inherits from discount_factor>

# ---------- Logging / checkpointing ----------
val_freq: 1000                            # (retained; unused after Stage 3 val block removal)
save_model_freq: 1000
print_freq: 100
summary_freq: 100
show_img_num: 2

# ---------- RL / TD (Controller + Reward) ----------
parameter_lr_mul: 1
value_lr_mul: 1
critic_lr_mul: 1
critic_logit_multiplier: 100
discount_factor: 1.0
filter_usage_penalty: 20.0            # V2-AI: 2^k * 20 exp penalty — 40 for 2nd pick, 80 for 3rd, ...
use_TD: true
maximum_trajectory_length: 7
over_length_keep_prob: 0.5
all_reward: 1.0
exploration: 0.2                      # V2-AI: raised from 0.05 for op-space coverage
exploration_penalty: 0.05
early_stop_penalty: 1.0
detect_loss_weight: 1.0
use_penalty: true
test_steps: 8                              # ISP rollout steps at train + val
grad_clip_norm: 1.0e-05                    # gradient clipping norm on Controller

# ---------- Stop bonus (V2-AI, learned STOP action) ----------
# Reward Controller for stopping when the current image already scores well.
# Formula:  bonus = max(0, 1-detect_after) * stop_bonus_scale * critic_logit_multiplier
# only fires on the step where action.is_stop is True. Off (=0) restores V1.
# With detect_after=0.1, scale=0.5, mult=100 → bonus ~ 45 (comparable to a
# few steps of task_delta), so learned STOP becomes attractive vs continuing.
stop_bonus_scale: 0.01

# ---------- Controller network ----------
base_channels: 32
dropout_keep_prob: 0.5
fc1_size: 128
feature_extractor_dims: 4096

# ---------- Replay memory ----------
replay_memory_size: 128
fresh_raw_ratio: 0.25
images_per_epoch: 1000                     # epoch definition; used by trainer to
                                           # compute max_iter_step = epochs * this / batch

# ---------- Latent noise ----------
z_type: uniform
z_dim_per_filter: 16

# ---------- Trainer defaults (tools/train.py --* args fall back to these) ----------
train:
  batch_size: 8                            # paper's headline recipe
  epochs: 800                              # paper's headline recipe
  lr: 3.0e-05
  imgsz: 512
  use_truncated: true
  bright_lo: 0.01                          # min mean brightness to count sample as valid
  bright_hi: 0.9                           # max mean brightness ("max_bri")
  lr_decay: 0.1                            # LambdaLR base
  lr_segments: 3                           # LambdaLR segment count

# ---------- Validation defaults (tools/val.py) ----------
val:
  conf_thres: 0.001                        # NMS confidence cutoff (vendored yolov3 default)
  iou_thres: 0.6                           # NMS IoU threshold
  max_det: 300                             # max detections per image after NMS
  imgsz: 512                               # eval image size

# ---------- Task-model constants (informational; wired via YOLOv3Detection) ----------
task_model:
  base_nc: 80                              # COCO class count used to scale hyp['cls']
  reference_imgsz: 640                     # baseline imgsz used to scale hyp['obj']
