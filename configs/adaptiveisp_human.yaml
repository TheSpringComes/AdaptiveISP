# H-BASE — Human Quality 任务基线（identity Front ISP + PPO）。
#
# 继承 configs/base/human.yaml 的全部共享配置；本文件只声明基线语义。
# 消融变体（v31_fixed / v31_stage2 / v31_external*）同样继承 base，
# 与本文件互为平级——比较时以 base 的共享参数为准。
#
# RL 算法已于 2026-09-13 从 actor_critic 切换为 ppo（默认来自 base）。
# 此前新 cache 上的 V3.1 A–E 消融全部跑的是 actor_critic，切换后的
# 数字与那批结果不可直接比较（分界见 docs/VERSION_HISTORY.md）。
base: configs/base/human.yaml

front_isp:
  enabled: false
  type: identity
