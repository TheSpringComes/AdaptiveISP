# AdaptiveISP V2-AI Human Quality task config — H-BASE.
#
# Overrides the main config for the FiveK + Expert C perceptual objective.
# Consumed by `engine.trainer_human.HumanTrainer` via `tools/train_human.py`.

# ---------- Operators ----------
operators:
  - exposure
  - gamma
  - ccm
  - sharpen
  - denoise
  - tone
  - contrast
  - saturation
  - wnb
  - whitebalance
  - n_awb
  - n_gain
  - n_gtm
  - n_chroma
  - n_gamma
  # - n_denoise
  # - n_detail

filters_runtime: [1.7, 2.0, 1.9, 6.3, 10.0, 2.7, 2.1, 2.0, 1.9, 1.7,
                  8.0, 3.0, 4.0, 0.4, 0.3]
filter_runtime_penalty: false
filter_runtime_penalty_lambda: 0.01

# ---------- Human Quality task ----------
human_quality:
  fivek_root:  /home/jing/datasets/fivek
  cache_dir:   /home/jing/datasets/fivek/cache_expert_c
  train_list:  /home/jing/datasets/fivek/train_expert_c.txt
  val_list:    /home/jing/datasets/fivek/val_expert_c.txt
  lambda_ssim:  1.0
  lambda_lpips: 1.0
  lpips_net:    alex

# ---------- Logging / checkpointing ----------
val_freq: 1000
save_model_freq: 1000
print_freq: 100
summary_freq: 100
show_img_num: 2

# ---------- RL / TD ----------
parameter_lr_mul: 1
value_lr_mul: 1
critic_lr_mul: 1
critic_logit_multiplier: 10
discount_factor: 1.0
filter_usage_penalty: 5.0             # H-BASE: 2^k × 5 exp penalty (10 for 2nd, 20 for 3rd, ...)
use_TD: true
maximum_trajectory_length: 10
all_reward: 1.0
exploration: 0.2                       # H-BASE: raised from 0.05 for op-space coverage
exploration_penalty: 0.05
early_stop_penalty: 1.0
detect_loss_weight: 1.0
use_penalty: true
test_steps: 5                          # H-T5: shorter ISP rollout
grad_clip_norm: 1.0e-05

# ---------- Stop bonus (learned STOP action) ----------
stop_bonus_scale: 0.5                  # bonus = (1-detect_after) × 0.5 × 10 = 5 max

# ---------- Controller network ----------
base_channels: 32
dropout_keep_prob: 0.5
fc1_size: 128
feature_extractor_dims: 4096
obs_hw: 128

# ---------- FiveK epoch definition — SMALL (ablation speed) ----------
# H-BASE etc.: `images_per_epoch: 500` (60 epochs × 500 / 4 = 7500 iter ≈ 3h)
images_per_epoch: 500

# ---------- Latent noise (cfg parity) ----------
z_type: uniform
z_dim_per_filter: 16

# ---------- Trainer defaults ----------
train:
  batch_size: 4
  epochs: 60
  lr: 3.0e-05
  imgsz: 512
  lr_decay: 0.1
  lr_segments: 3
