# V3.1 消融 D 组 — external Front ISP（infinite_isp 后端）。
#
# 前置条件（wrapper 构建期会给出可操作的报错指引）：
#   front_isp/third_party/InfiniteISP_RAW（上游 Infinite-ISP + 已验证的
#   hikrobot_baseline.yml 基线：传感器标定模块全关）。换 backend 只改
#   external.backend。
#
# 用法：
#   python tools/train.py --task human \
#       --cfg configs/adaptiveisp_human_v31_external.yaml \
#       --save_path v31_external
base: configs/base/human.yaml

front_isp:
  enabled: true
  type: external
  external:
    backend: infinite_isp          # infinite_isp | samsung_isp
    repo_path: front_isp/third_party/InfiniteISP_RAW
    config_path: front_isp/third_party/InfiniteISP_RAW/config/hikrobot_baseline.yml
    device: gpu                    # cpu | gpu（optional_gpu 加速，4090 实测 ~4s/iter）
