# V3.1 消融 E 组 — external Front ISP（samsung_isp 后端）。
#
# 前置条件（wrapper 构建期会给出可操作的报错指引）：
#   Samsung Modular Neural ISP clone + 预训练权重，
#   见 front_isp/modular_neural_isp/wrapper.py 头注释。
#
# 用法：
#   python tools/train.py --task human \
#       --cfg configs/adaptiveisp_human_v31_external_samsung.yaml \
#       --save_path v31_external_samsung
base: configs/base/human.yaml

front_isp:
  enabled: true
  type: external
  external:
    backend: samsung_isp
