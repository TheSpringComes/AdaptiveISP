# V3.1 消融 B 组 — fixed Front ISP（FittedISP 拟合方法）。
#
#     RAW → Front ISP(全局拟合参数，运行期固定) → Baseline RGB → AdaptiveISP → ...
#
# 参数由 tools/fit_front_isp.py 用 FittedISP 的 IRLS 拟合方法在 FiveK
# 训练集上离线拟合一次（configs/front_isp/fitted_fivek.json），运行期
# 完全固定、无可训练参数。重新拟合：python tools/fit_front_isp.py
#
# 用法：
#   python tools/train.py --task human \
#       --cfg configs/adaptiveisp_human_v31_fixed.yaml \
#       --save_path v31_fixed
base: configs/base/human.yaml

operators:
  - exposure
  - gamma
  - ccm
  - sharpen
  - denoise
  - tone
  - contrast
  - saturation
  - wnb
  - whitebalance
  - n_awb
  - n_gain
  - n_gtm
  - n_chroma
  - n_gamma

front_isp:
  enabled: true
  type: fixed
  fixed:
    params: configs/front_isp/fitted_fivek.json   # FittedISP 格式参数
