# V3.1 消融 — fixed Front ISP（人工配置 ISP，V3.1 模式之二）。
#
#     RAW → Front ISP(人工链，参数固定) → Baseline RGB → AdaptiveISP → ...
#
# 用法：
#   python tools/train.py --task human \
#       --cfg configs/adaptiveisp_human_v31_fixed.yaml \
#       --save_path v31_fixed
#
# 默认链：gray-world AWB → gamma 1/2.2。全部参数手工设定，训练中不更新。
# 可用模块见 front_isp/fixed.py::list_fixed_modules()：
#   wb(grayworld 或固定 gains) / ccm(含 'cam2rgb' 快捷方式) / bias /
#   gamma / exposure / smoothstep —— 新增模块 = 注册一个函数即可。

# ---------- Operators（与 H-BASE 相同）----------
operators:
  - exposure
  - gamma
  - ccm
  - sharpen
  - denoise
  - tone
  - contrast
  - saturation
  - wnb
  - whitebalance
  - n_awb
  - n_gain
  - n_gtm
  - n_chroma
  - n_gamma

# ---------- Front ISP: fixed（V3.1 模式之二） ----------
front_isp:
  enabled: true
  type: fixed
  fixed:
    modules:
      - {name: wb, auto: grayworld}
      # 可选示例（取消注释即生效）：
      # - {name: exposure, ev: -0.3}
      # - {name: ccm, matrix: cam2rgb, bias: [0, 0, 0]}
      - {name: gamma, gamma: 0.4545}     # 1/2.2 编码 gamma

# ---------- 其余与 H-BASE 相同 ----------
action_mask:
  no_repeat: {enabled: false}
  order: {enabled: false, rules: []}
  group_budget: {enabled: false, groups: []}

rl_algo:
  name: actor_critic

human_quality:
  fivek_root:  /home/jing/datasets/fivek
  cache_dir:   /home/jing/datasets/fivek/cache_expert_c
  train_list:  /home/jing/datasets/fivek/train_expert_c.txt
  val_list:    /home/jing/datasets/fivek/val_expert_c.txt
  lambda_ssim:  1.0
  lambda_lpips: 1.0
  lpips_net:    alex

val_freq: 1000
save_model_freq: 1000
print_freq: 100
summary_freq: 100
show_img_num: 2

filters_runtime: [1.7, 2.0, 1.9, 6.3, 10.0, 2.7, 2.1, 2.0, 1.9, 1.7,
                  8.0, 3.0, 4.0, 0.4, 0.3]
filter_runtime_penalty: false

parameter_lr_mul: 1
value_lr_mul: 1
critic_lr_mul: 1
critic_logit_multiplier: 10
discount_factor: 1.0
filter_usage_penalty: 5.0
use_TD: true
maximum_trajectory_length: 10
all_reward: 1.0
exploration: 0.2
exploration_penalty: 0.05
early_stop_penalty: 1.0
detect_loss_weight: 1.0
use_penalty: true
test_steps: 8
grad_clip_norm: 1.0e-05
stop_bonus_scale: 0.5

base_channels: 32
dropout_keep_prob: 0.5
fc1_size: 128
feature_extractor_dims: 4096
obs_hw: 128

images_per_epoch: 500

z_type: uniform
z_dim_per_filter: 16

train:
  batch_size: 4
  epochs: 25
  lr: 3.0e-05
  imgsz: 512
  lr_decay: 0.1
  lr_segments: 3
