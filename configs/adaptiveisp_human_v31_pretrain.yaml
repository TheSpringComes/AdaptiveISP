# V3.1 Stage 1 — learnable Front ISP 预训练（LearnableTrainer）。
#
# 关闭 AdaptiveISP，只训练 Front ISP 的可学习参数：
#     RAW → Front ISP(WB, CCM, Bias, Tone) → Base RGB
#                                      ↘ L_calib vs Expert C
# 损失：L_calib = λ1·L1 + λs·(1-SSIM) + λp·LPIPS
#
# 用法：
#   python tools/train.py --task learnable \
#       --cfg configs/adaptiveisp_human_v31_pretrain.yaml \
#       --save_path v31_stage1 --epochs 5 --batch_size 8
#
# 产出：experiments/v31_stage1/ckpt/LearnableISP_iter_*.pth
#（含 front_isp 标定 state + camera_names），供 Stage 2 加载后冻结。
#
# 本文件不继承 base/human.yaml：LearnableTrainer 不消费 RL/算子/奖励键，
# 继承只会引入无关语义。小规模验证加 --max_iters 40（配合 save_model_freq: 20）。

operators:   # LearnableTrainer 不用算子，但 load_config 需要
  - exposure
  - gamma

front_isp:
  enabled: true
  type: learnable
  learnable:
    camera_specific: true      # FiveK 35 台相机 → 逐相机 {WB, CCM, Bias, Gamma}
    n_cameras: 24              # 训练侧会按数据实际相机数覆盖
    white_balance: {learnable: true}
    ccm:          {learnable: true}
    bias:         {learnable: true}
    tone:         {learnable: true}
    init:
      type: identity           # identity | fittedisp | camera_specific
      # params: params.json    # fittedisp 初始化时的参数文件

# Stage 1 损失权重
training:
  lambda_l1:    1.0
  lambda_ssim:  1.0
  lambda_lpips: 1.0

human_quality:
  fivek_root:  /home/jing/datasets/fivek
  cache_dir:   /home/jing/datasets/fivek/cache_expert_c
  train_list:  /home/jing/datasets/fivek/train_expert_c.txt
  val_list:    /home/jing/datasets/fivek/val_expert_c.txt
  lambda_ssim:  1.0
  lambda_lpips: 1.0
  lpips_net:    alex

save_model_freq: 2500       # 与 epochs×iters 对齐；Stage 2 从这里取 ckpt
print_freq: 50
summary_freq: 100
show_img_num: 2
