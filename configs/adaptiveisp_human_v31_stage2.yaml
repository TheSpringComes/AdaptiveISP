# V3.1 Stage 2 — AdaptiveISP 训练（learnable Front ISP 冻结）。
#
#     Stage 1 产物（LearnableISP ckpt）→ 加载并冻结
#         ↓
#     AdaptiveISP（Controller + RL）→ Expert C / Task Loss
#
# 用法（先完成 Stage 1 预训练，ckpt 路径写在 front_isp.learnable.ckpt）：
#   python tools/train.py --task human \
#       --cfg configs/adaptiveisp_human_v31_stage2.yaml \
#       --save_path v31_stage2
base: configs/base/human.yaml

front_isp:
  enabled: true
  type: learnable
  learnable:
    camera_specific: true
    # n_cameras 由训练侧按数据自动覆盖
    white_balance: {learnable: true}   # learnable 只在 Stage 1 生效；
    ccm:          {learnable: true}    # Stage 2 恒冻结
    bias:         {learnable: true}
    tone:         {learnable: true}
    init:
      type: identity
    # Stage 1 预训练结果（LearnableISP ckpt），构建时加载后冻结。
    # 换用其他 Stage-1 run 时改这一行：
    ckpt: experiments/v31_ablation_stage1/ckpt/LearnableISP_iter_1500.pth
