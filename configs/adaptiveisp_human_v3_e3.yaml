# AdaptiveISP V3-E3 Human Quality — FiveK + Backbone + Mask + PPO.
#
# Human counterpart to configs/adaptiveisp_v3_e3.yaml. Consumed by
# `engine.trainer_human.HumanTrainer` via `tools/train.py --task human`.
# Beyond adaptiveisp_human.yaml only the three V3 blocks change:
#   canonical_backbone.enabled: true
#   action_mask: full set (no_repeat + order + group_budget)
#   rl_algo.name: ppo
# Human op set (15 ops) is smaller than Detection (24); mask rules are
# adjusted accordingly (no `inf_*` group members, since those are not
# in the operators list here).

operators:
  - exposure
  - gamma
  - ccm
  - sharpen
  - denoise
  - tone
  - contrast
  - saturation
  - wnb
  - whitebalance
  - n_awb
  - n_gain
  - n_gtm
  - n_chroma
  - n_gamma

filters_runtime: [1.7, 2.0, 1.9, 6.3, 10.0, 2.7, 2.1, 2.0, 1.9, 1.7,
                  8.0, 3.0, 4.0, 0.4, 0.3]
filter_runtime_penalty: false
filter_runtime_penalty_lambda: 0.01

# ---------- Canonical Backbone ---------- (E1)
canonical_backbone:
  enabled: true

# ---------- Action Mask ---------- (E2)
action_mask:
  no_repeat:
    enabled: true
  order:
    enabled: true
    rules:
      - after:  [sharpen]
        before: [denoise]
  group_budget:
    enabled: true
    groups:
      - name: awb
        ops: [whitebalance, wnb, n_awb]
        max_select: 1
      # denoise: only one op in Human's list; unused (harmless).
      - name: denoise
        ops: [denoise]
        max_select: 1
      - name: sharpen
        ops: [sharpen]
        max_select: 1
      # Tonal group — includes n_gamma / n_gtm neural counterparts.
      - name: tonal
        ops: [exposure, gamma, tone, contrast, n_gamma, n_gtm]
        max_select: 2

# ---------- RL Algorithm ---------- (E3: PPO)
rl_algo:
  name: ppo
  ppo:
    epochs: 4
    clip_range: 0.2
    value_coef: 0.5
    entropy_coef: 0.01
    advantage_norm: true
    minibatch_size: 64
    grad_clip_norm: 0.5
    gae_lambda: 0.95

# ---------- Human Quality task ----------
human_quality:
  fivek_root:  /home/jing/datasets/fivek
  cache_dir:   /home/jing/datasets/fivek/cache_expert_c
  train_list:  /home/jing/datasets/fivek/train_expert_c.txt
  val_list:    /home/jing/datasets/fivek/val_expert_c.txt
  lambda_ssim:  1.0
  lambda_lpips: 1.0
  lpips_net:    alex

# ---------- Logging / checkpointing ----------
val_freq: 1000
save_model_freq: 1000
print_freq: 100
summary_freq: 100
show_img_num: 2

# ---------- RL / TD ----------
parameter_lr_mul: 1
value_lr_mul: 1
critic_lr_mul: 1
critic_logit_multiplier: 10
discount_factor: 1.0
filter_usage_penalty: 5.0
use_TD: true
maximum_trajectory_length: 10
all_reward: 1.0
exploration: 0.2
exploration_penalty: 0.05
early_stop_penalty: 1.0
detect_loss_weight: 1.0
use_penalty: true
test_steps: 8
grad_clip_norm: 1.0e-05

# Stop bonus — PPO normalizes advantages, so the original scale of 0.5 ×
# critic_logit_multiplier(10) = 5 would dominate. Drop 10× for E3, same
# ratio as Detection E3.
stop_bonus_scale: 0.05

# ---------- Controller network ----------
base_channels: 32
dropout_keep_prob: 0.5
fc1_size: 128
feature_extractor_dims: 4096
obs_hw: 128

images_per_epoch: 500

z_type: uniform
z_dim_per_filter: 16

train:
  batch_size: 4
  epochs: 60
  lr: 3.0e-05
  imgsz: 512
  lr_decay: 0.1
  lr_segments: 3
