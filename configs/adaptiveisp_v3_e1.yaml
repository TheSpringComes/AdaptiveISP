# AdaptiveISP V3 experiment E1 — Detection + Fixed Canonical Backbone.
#
# Ablation direction:
#   E0 (adaptiveisp.yaml)   canonical_backbone.enabled: false   V2 baseline
#   E1 (this file)          canonical_backbone.enabled: true    +A1 阶段 1
#
# Only knob changed vs V2 is the backbone switch. Reward, RL algo (Actor-
# Critic), search space, op list are identical to V2 detection so the E0→E1
# diff isolates the effect of a fixed baseline sRGB starting point.

# ---------- Operators ---------- (identical to adaptiveisp.yaml)
operators:
  - exposure
  - gamma
  - ccm
  - sharpen
  - denoise
  - tone
  - contrast
  - saturation
  - wnb
  - whitebalance
  - n_awb
  - n_gain
  - n_gtm
  - n_chroma
  - n_gamma
  - inf_awb_grayworld
  - inf_awb_norm2
  - inf_awb_pca
  - inf_digital_gain
  - inf_ldci
  - inf_unsharp
  - inf_nlm
  - inf_ebf
  - inf_saturation

filters_runtime: [1.7, 2.0, 1.9, 6.3, 10.0, 2.7, 2.1, 2.0, 1.9, 1.7,
                  8.0, 3.0, 4.0, 0.4, 0.3,
                  1.5, 1.5, 3.0, 1.0, 3.5, 5.0, 12.0, 8.0, 1.7]
filter_runtime_penalty: false
filter_runtime_penalty_lambda: 0.01

# ---------- Canonical Backbone (V3-A1 阶段 1) — ON ----------
canonical_backbone:
  enabled: true

# ---------- Logging / checkpointing ----------
val_freq: 1000
save_model_freq: 1000
print_freq: 100
summary_freq: 100
show_img_num: 2

# ---------- RL / TD ----------
parameter_lr_mul: 1
value_lr_mul: 1
critic_lr_mul: 1
critic_logit_multiplier: 100
discount_factor: 1.0
filter_usage_penalty: 20.0
use_TD: true
maximum_trajectory_length: 7
over_length_keep_prob: 0.5
all_reward: 1.0
exploration: 0.2
exploration_penalty: 0.05
early_stop_penalty: 1.0
detect_loss_weight: 1.0
use_penalty: true
test_steps: 8
grad_clip_norm: 1.0e-05

stop_bonus_scale: 0.01

# ---------- Controller network ----------
base_channels: 32
dropout_keep_prob: 0.5
fc1_size: 128
feature_extractor_dims: 4096

# ---------- Replay memory ----------
replay_memory_size: 128
fresh_raw_ratio: 0.25
images_per_epoch: 1000

# ---------- Latent noise ----------
z_type: uniform
z_dim_per_filter: 16

# ---------- Trainer defaults ----------
train:
  batch_size: 8
  epochs: 800
  lr: 3.0e-05
  imgsz: 512
  use_truncated: true
  bright_lo: 0.01
  bright_hi: 0.9
  lr_decay: 0.1
  lr_segments: 3

# ---------- Validation defaults ----------
val:
  conf_thres: 0.001
  iou_thres: 0.6
  max_det: 300
  imgsz: 512

# ---------- Task-model constants ----------
task_model:
  base_nc: 80
  reference_imgsz: 640
