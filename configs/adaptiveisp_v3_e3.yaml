# AdaptiveISP V3 experiment E3 — Detection + Backbone + Mask + PPO.
#
# Ablation direction:
#   E0 (adaptiveisp.yaml)     baseline (Actor-Critic + ReplayMemory)
#   E1 (adaptiveisp_v3_e1.yaml)  +A1 Canonical Backbone
#   E2 (adaptiveisp_v3_e2.yaml)  +A1 +A2 Action Mask
#   E3 (this file)             +A1 +A2 +PPO  (drops ReplayMemory)
#
# Beyond E2 only `rl_algo` changes: `name: ppo` switches Detection from
# 1-step TD + ReplayMemory to T-step rollout → GAE → K-epoch clipped PPO.
# The Detection trainer bypasses the replay pool under PPO (on-policy),
# but still routes fresh samples through the pool's backbone-application
# helper so the E1/E2 → E3 image-space diff is nil.

operators:
  - exposure
  - gamma
  - ccm
  - sharpen
  - denoise
  - tone
  - contrast
  - saturation
  - wnb
  - whitebalance
  - n_awb
  - n_gain
  - n_gtm
  - n_chroma
  - n_gamma
  - inf_awb_grayworld
  - inf_awb_norm2
  - inf_awb_pca
  - inf_digital_gain
  - inf_ldci
  - inf_unsharp
  - inf_nlm
  - inf_ebf
  - inf_saturation

filters_runtime: [1.7, 2.0, 1.9, 6.3, 10.0, 2.7, 2.1, 2.0, 1.9, 1.7,
                  8.0, 3.0, 4.0, 0.4, 0.3,
                  1.5, 1.5, 3.0, 1.0, 3.5, 5.0, 12.0, 8.0, 1.7]
filter_runtime_penalty: false
filter_runtime_penalty_lambda: 0.01

# ---------- Canonical Backbone ---------- (E1)
canonical_backbone:
  enabled: true

# ---------- Action Mask ---------- (E2)
action_mask:
  no_repeat:
    enabled: true
    exempt: []
  order:
    enabled: true
    rules:
      - after:  [sharpen, inf_unsharp]
        before: [denoise, inf_nlm, inf_ebf]
  group_budget:
    enabled: true
    groups:
      - name: awb
        ops: [whitebalance, wnb, n_awb,
              inf_awb_grayworld, inf_awb_norm2, inf_awb_pca]
        max_select: 1
      - name: denoise
        ops: [denoise, inf_nlm, inf_ebf]
        max_select: 1
      - name: sharpen
        ops: [sharpen, inf_unsharp]
        max_select: 1
      - name: saturation
        ops: [saturation, inf_saturation]
        max_select: 1
      - name: tonal
        ops: [exposure, gamma, tone, contrast, n_gamma, n_gtm, inf_ldci]
        max_select: 2

# ---------- RL Algorithm ---------- (E3: PPO)
rl_algo:
  name: ppo
  ppo:
    epochs: 4
    clip_range: 0.2
    value_coef: 0.5
    entropy_coef: 0.01
    advantage_norm: true
    minibatch_size: 64
    grad_clip_norm: 0.5
    gae_lambda: 0.95
    gamma: 0.95   # discount long-horizon returns so value_net can fit

# ---------- Logging / checkpointing ----------
val_freq: 1000
save_model_freq: 1000
print_freq: 100
summary_freq: 100
show_img_num: 2

# ---------- RL / TD (Actor-Critic parity fields; harmless under PPO) ----------
parameter_lr_mul: 1
value_lr_mul: 1
critic_lr_mul: 1
# V3-A3 note: dropped from 100 (Detection legacy) to 10 (Human parity).
# With mul=100 and T=8, per-step reward can hit ±5, cumulative return
# ±40 — value_net can't track and value_loss explodes (observed 19815
# at iter 100 in a smoke run). At mul=10 the return scale drops to ±4,
# well within an MSE-fittable band.
critic_logit_multiplier: 10
discount_factor: 1.0
filter_usage_penalty: 20.0
use_TD: true
maximum_trajectory_length: 7
over_length_keep_prob: 0.5
all_reward: 1.0
exploration: 0.2
exploration_penalty: 0.05
early_stop_penalty: 1.0
detect_loss_weight: 1.0
use_penalty: true
test_steps: 8
grad_clip_norm: 1.0e-05

# Stop bonus — with critic_logit_multiplier reduced to 10, keep effective
# stop reward at 0.01 × 10 ≈ 0.1 (same magnitude as previous 0.001 × 100).
stop_bonus_scale: 0.01

# Force at least this many ops before STOP is allowed. Prevents PPO's
# "1-step then STOP" collapse observed in early smoke runs.
min_rollout_length: 3

# ---------- Controller network ----------
base_channels: 32
dropout_keep_prob: 0.5
fc1_size: 128
feature_extractor_dims: 4096

# ---------- Replay memory (kept for `get_next_RAW` path used in PPO too) ----------
replay_memory_size: 128
fresh_raw_ratio: 0.25
images_per_epoch: 1000

# ---------- Latent noise ----------
z_type: uniform
z_dim_per_filter: 16

# ---------- Trainer defaults ----------
train:
  batch_size: 8
  epochs: 800
  lr: 3.0e-05
  imgsz: 512
  use_truncated: true
  bright_lo: 0.01
  bright_hi: 0.9
  lr_decay: 0.1
  lr_segments: 3

# ---------- Validation defaults ----------
val:
  conf_thres: 0.001
  iou_thres: 0.6
  max_det: 300
  imgsz: 512

# ---------- Task-model constants ----------
task_model:
  base_nc: 80
  reference_imgsz: 640
